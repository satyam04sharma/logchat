events {}
http {
  access_log off;
  error_log /dev/stderr crit;
  server {
    listen 8000;
    location = /health { return 200 'ok'; }
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rest/v1/ {
      proxy_pass http://rest:3000/;
      proxy_set_header Host $host;
    }
  }
}

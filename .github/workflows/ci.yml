name: Native release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: runner.os != 'macOS'
        with:
          python-version: ${{ matrix.python }}
      # Homebrew enables loadable SQLite extensions; the hosted framework
      # Python on macOS does not provide the sqlite-vec capability we require.
      - name: Select macOS Python with SQLite extension support
        if: runner.os == 'macOS'
        run: |
          brew install python@${{ matrix.python }}
          echo "$(brew --prefix python@${{ matrix.python }})/libexec/bin" >> "$GITHUB_PATH"
      - name: Check SQLite extension loading capability
        run: python -c "import sqlite3; assert hasattr(sqlite3.Connection, 'enable_load_extension'), 'Python must support SQLite loadable extensions'"
      - name: Create isolated CI environment
        run: |
          python -m venv "$RUNNER_TEMP/logchat-ci"
          echo "$RUNNER_TEMP/logchat-ci/bin" >> "$GITHUB_PATH"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: node tests/native_ui_contract.cjs
      - run: python -m build
      - run: python scripts/check_release_artifacts.py
      - run: python scripts/check_release_wheel.py dist/logchat-0.3.0rc12-py3-none-any.whl
      - run: python -m venv /tmp/logchat-installed-check
      - run: /tmp/logchat-installed-check/bin/python -m pip install dist/logchat-0.3.0rc12-py3-none-any.whl
      - run: /tmp/logchat-installed-check/bin/logchat --help
      - run: /tmp/logchat-installed-check/bin/logchat install --help
      - run: /tmp/logchat-installed-check/bin/logchat local connect-provider --help

  legacy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm audit --audit-level=high

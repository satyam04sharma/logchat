name: Native release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: node tests/native_ui_contract.cjs
      - run: python -m build
      - run: python scripts/check_release_artifacts.py
      - run: python scripts/check_release_wheel.py dist/logchat-0.3.0rc12-py3-none-any.whl
      - run: python -m venv /tmp/logchat-installed-check
      - run: /tmp/logchat-installed-check/bin/python -m pip install dist/logchat-0.3.0rc12-py3-none-any.whl
      - run: /tmp/logchat-installed-check/bin/logchat --help
      - run: /tmp/logchat-installed-check/bin/logchat install --help
      - run: /tmp/logchat-installed-check/bin/logchat local connect-provider --help

  legacy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm audit --audit-level=high
